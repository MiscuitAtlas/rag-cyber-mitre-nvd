name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Les tests utilisent un embedder et un LLM factices : ni PyTorch, ni modèle Hugging Face, ni Ollama.
      - name: Installer les dépendances (sans sentence-transformers)
        run: |
          grep -v sentence-transformers requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
